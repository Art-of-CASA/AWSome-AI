[theme]
base = "light"
primaryColor = "#28624f"
backgroundColor = "#f6f7f2"
secondaryBackgroundColor = "#eff2eb"
textColor = "#193d36"
font = "sans serif"

# Site public : aucune trace d'erreur (chemins, code) ni menu de développement pour les visiteurs.
# Les détails restent dans les journaux du serveur (journalctl -u alphaforge).
[client]
showErrorDetails = "none"
toolbarMode = "viewer"
