name: Deploy site to AWS

on:
  push:
    branches:
      - main
    paths:
      - "mvp_profil/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-alphaforge-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Package and deploy Streamlit site
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::024848442163:role/GitHubActions-AlphaforgeDeploy
          aws-region: us-east-1

      - name: Package site
        shell: bash
        run: |
          set -euo pipefail
          python scripts/preparer_mvp.py "$RUNNER_TEMP/mvp_profil.zip"

      - name: Upload package to S3
        run: >-
          aws s3 cp "$RUNNER_TEMP/mvp_profil.zip"
          s3://alphaforge-mvp-024848442163-us-east-1/app/mvp_profil.zip

      - name: Deploy package and restart service through SSM
        shell: bash
        run: |
          set -euo pipefail
          command_id="$(aws ssm send-command \
            --instance-ids i-0ccf3bf86e9f31c07 \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["set -e","cd /opt/alphaforge","aws s3 cp s3://alphaforge-mvp-024848442163-us-east-1/app/mvp_profil.zip app.zip","unzip -o app.zip -d app","systemctl restart alphaforge"]' \
            --query 'Command.CommandId' --output text)"
          echo "SSM command: $command_id"

          for attempt in $(seq 1 60); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id i-0ccf3bf86e9f31c07 \
              --query 'Status' --output text 2>/dev/null || true)"
            case "$status" in
              Success)
                echo "Deployment completed successfully."
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Undeliverable|Terminated|InvalidPlatform)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id i-0ccf3bf86e9f31c07 \
                  --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json || true
                exit 1
                ;;
              *)
                sleep 10
                ;;
            esac
          done

          echo "Timed out waiting for SSM command $command_id"
          exit 1
