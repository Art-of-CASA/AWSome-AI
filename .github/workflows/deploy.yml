name: Deploy site to AWS

# Le site suit la branche main : chaque mise à jour de main qui touche le site est testée, puis déployée.
on:
  push:
    branches:
      - main
    paths:
      - "mvp_profil/**"
      - "config/**"
      - "scripts/preparer_mvp.py"
      - "scripts/installer_serveur.sh"
      - "scripts/lancer_tests.py"
      - ".github/workflows/deploy.yml"
  # Une pull request vers main lance seulement les tests : on sait avant la fusion si le site sera déployable.
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-alphaforge-production
  cancel-in-progress: false

jobs:
  test:
    name: Run all test suites
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            mvp_profil/requirements.txt
            mvp_profil/constraints.txt

      - name: Set up Node.js (voice component test)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r mvp_profil/requirements.txt

      - name: Run tests (no cloud call)
        run: |
          python scripts/lancer_tests.py --timeout 300
          python mvp_profil/evaluer_classement.py --verifier

  deploy:
    name: Package and deploy Streamlit site
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Paquet complet et vérifié (inventaire, empreintes, version) : la même procédure qu'en local.
      - name: Build verified package
        id: paquet
        shell: bash
        run: |
          set -euo pipefail
          python scripts/preparer_mvp.py "$RUNNER_TEMP/mvp_profil.zip"
          version="$(python -c "import sys; sys.path.insert(0, 'mvp_profil'); from version_profil import version_courante; print(version_courante())")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version à déployer : $version"

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::024848442163:role/GitHubActions-AlphaforgeDeploy
          aws-region: us-east-1

      - name: Upload package to S3
        run: >-
          aws s3 cp "$RUNNER_TEMP/mvp_profil.zip"
          s3://alphaforge-mvp-024848442163-us-east-1/app/mvp_profil.zip

      - name: Install on the instance, check the page, roll back on failure
        shell: bash
        env:
          VERSION: ${{ steps.paquet.outputs.version }}
        run: |
          set -euo pipefail
          python - <<'FIN'
          import json, os
          script = f"VERSION={os.environ['VERSION']}\n" + open("scripts/installer_serveur.sh", encoding="utf-8").read()
          json.dump({"commands": [script], "executionTimeout": ["900"]}, open("ssm_params.json", "w"))
          FIN
          command_id="$(aws ssm send-command \
            --instance-ids i-0ccf3bf86e9f31c07 \
            --document-name AWS-RunShellScript \
            --comment "Deploiement $VERSION" \
            --parameters file://ssm_params.json \
            --query 'Command.CommandId' --output text)"
          echo "SSM command: $command_id"

          for attempt in $(seq 1 90); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id i-0ccf3bf86e9f31c07 \
              --query 'Status' --output text 2>/dev/null || true)"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Undeliverable|Terminated|InvalidPlatform)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id i-0ccf3bf86e9f31c07 \
                  --query '[StandardOutputContent,StandardErrorContent]' --output text
                if [ "$status" = "Success" ]; then
                  echo "Deployment completed successfully: $VERSION"
                  exit 0
                fi
                echo "Deployment failed with status: $status"
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "Deployment timed out while waiting for SSM."
          exit 1
